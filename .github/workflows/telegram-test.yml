# Prova del gruppo Telegram: un messaggio finto per ogni notifica (commit, cassetta, segnalazioni,
# silenzio automatico). Si lancia a mano da GitHub, o con un push di questo file sul ramo prova.
name: Prova Telegram

on:
  workflow_dispatch:
  push:
    branches: [prova]
    paths:
      - .github/workflows/telegram-test.yml
      - scripts/telegram-test.mjs

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'tomm4so00/casadolcecasa'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Build dei testi del server
        run: npm ci --prefix server && npm run build --prefix server
      - name: Manda i messaggi di prova
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/telegram-test.mjs
