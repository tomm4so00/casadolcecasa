# Worker che riceve da Stripe i pagamenti della criogenesi (vedi docs/criogenesi.md).
# I segreti non stanno qui: si caricano con "npx wrangler secret put <NOME>".
name = "casadolcecasa-criogenesi"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
FIREBASE_DATABASE_URL = "https://casadolcecasa-6d92a-default-rtdb.firebaseio.com"
# id del Payment Link della criogenesi (plink_…), modalità live di Stripe.
# Quello di prova era plink_1UYmJ3ED0NNIO3xrYGARvqOI (sandbox).
STRIPE_CRYO_PAYMENT_LINK = "plink_1UYontED0NNIO3xr0zR7q2O4"

[observability]
enabled = true
